<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل EasyCap الاحترافي</title>
    <style>
        :root { --main-color: #00e676; --bg-color: #121212; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .container { width: 95%; max-width: 800px; text-align: center; background: #1e1e1e; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        video { width: 100%; border-radius: 10px; background: #000; border: 2px solid #333; margin-bottom: 15px; transform: scaleX(1); /* تعدل إذا كانت الصورة مقلوبة */ }
        .controls { display: grid; gap: 15px; grid-template-columns: 1fr; margin-bottom: 20px; }
        select, button { padding: 14px; border-radius: 8px; border: none; font-size: 16px; }
        select { background: #333; color: white; cursor: pointer; width: 100%; }
        button { background: var(--main-color); color: #000; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.9; }
        .status { margin-top: 10px; font-size: 14px; color: #888; padding: 10px; border-radius: 5px; background: #252525; }
    </style>
</head>
<body>

<div class="container">
    <h2>شاشة عرض الرسيفر 📺</h2>

    <video id="videoRender" autoplay playsinline muted></video>

    <div class="controls">
        <div>
            <label>مصدر الفيديو (EasyCap):</label>
            <select id="videoSource"></select>
        </div>

        <div>
            <label>مصدر الصوت (USB Audio):</label>
            <select id="audioSource"></select>
        </div>

        <button id="startBtn">تشغيل البث الآن</button>
    </div>

    <div class="status" id="statusMsg">انتظار التعرف على الوصلة...</div>
</div>

<script>
    const videoElement = document.getElementById('videoRender');
    const videoSelect = document.getElementById('videoSource');
    const audioSelect = document.getElementById('audioSource');
    const startBtn = document.getElementById('startBtn');
    const statusMsg = document.getElementById('statusMsg');
    
    let audioCtx;

    // جلب قائمة الأجهزة
    async function getDevices() {
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            videoSelect.innerHTML = '';
            audioSelect.innerHTML = '';

            devices.forEach(device => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                if (device.kind === 'videoinput') {
                    option.text = device.label || `EasyCap Video ${videoSelect.length + 1}`;
                    videoSelect.appendChild(option);
                } else if (device.kind === 'audioinput') {
                    option.text = device.label || `USB Audio ${audioSelect.length + 1}`;
                    audioSelect.appendChild(option);
                }
            });
        } catch (err) {
            statusMsg.innerText = "خطأ في سرد الأجهزة: " + err.message;
        }
    }

    // تشغيل البث مع إعدادات مرنة (Flexible Constraints)
    async function startStream() {
        if (window.stream) {
            window.stream.getTracks().forEach(track => track.stop());
        }

        const constraints = {
            video: {
                deviceId: videoSelect.value ? { exact: videoSelect.value } : undefined,
                // إلغاء تحديد العرض والارتفاع الصارم للسماح للوصلة بالعمل بدقتها الأصلية
                width: { ideal: 720 },
                height: { ideal: 576 }
            },
            audio: {
                deviceId: audioSelect.value ? { exact: audioSelect.value } : undefined
            }
        };

        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            window.stream = stream;
            videoElement.srcObject = stream;

            // معالجة الصوت ليخرج من مكبر صوت الموبايل
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            // في حالة كان الـ AudioContext في وضع تعليق (بسبب سياسة المتصفح)
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            const source = audioCtx.createMediaStreamSource(stream);
            source.connect(audioCtx.destination);

            statusMsg.innerText = "متصل بنجاح! جاري عرض البث...";
            statusMsg.style.color = "#00e676";
        } catch (err) {
            console.error(err);
            statusMsg.innerText = "خطأ: تأكد من اختيار الجهاز الصحيح وإعطاء الصلاحيات.";
            statusMsg.style.color = "#ff5252";
        }
    }

    // طلب الإذن المبدئي وتحديث القائمة
    async function init() {
        try {
            await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            await getDevices();
            statusMsg.innerText = "تم العثور على الوصلة. اخترها من القائمة واضغط تشغيل.";
        } catch (err) {
            statusMsg.innerText = "يجب السماح بالوصول للكاميرا والميكروفون لتعمل الوصلة.";
        }
    }

    startBtn.onclick = startStream;
    navigator.mediaDevices.ondevicechange = getDevices;

    // تشغيل التهيئة عند تحميل الصفحة
    init();
</script>

</body>
</html>
