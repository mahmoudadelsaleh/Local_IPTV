<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الاتصال بالعملاء</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <style>
        :root { --primary: #007bff; --success: #25D366; --bg: #f8f9fa; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--bg); display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
        .container { width: 95%; max-width: 420px; background: white; padding: 15px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-height: 98vh; overflow-y: auto; }
        
        /* منطقة العرض */
        .image-wrapper { width: 100%; height: 220px; background: #eee; border-radius: 15px; overflow: hidden; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; position: relative; }
        img, video { max-width: 100%; max-height: 100%; }

        .btn { width: 100%; padding: 12px; margin: 5px 0; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: #6c757d; color: white; }
        .btn-edit { background: #f1c40f; color: black; padding: 5px 10px; width: auto; font-size: 13px; display: inline-block; }

        /* منطقة النتائج */
        .result-box { display: none; border: 2px solid var(--primary); border-radius: 15px; padding: 12px; margin-top: 10px; text-align: right; }
        .phone-display { font-size: 24px; font-weight: bold; color: #d32f2f; text-align: center; margin: 5px 0; letter-spacing: 2px; }

        /* لوحة المفاتيح المصغرة */
        #num-pad { display: none; grid-template-columns: repeat(3, 1fr); gap: 5px; background: #e2e8f0; padding: 8px; border-radius: 10px; margin-top: 10px; max-width: 200px; margin-left: auto; margin-right: auto; }
        .key { background: white; padding: 10px; border-radius: 5px; font-weight: bold; font-size: 18px; text-align: center; cursor: pointer; box-shadow: 0 2px 0 #cbd5e1; }
        .key:active { transform: translateY(1px); box-shadow: none; background: #f8fafc; }
        .key.del { background: #f87171; color: white; }
        .key.clear { background: #9ca3af; color: white; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        #status { font-size: 12px; color: #777; margin-bottom: 5px; height: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div id="status">جاهز</div>

    <div class="image-wrapper">
        <video id="video" autoplay playsinline></video>
        <img id="image-to-crop">
    </div>

    <div id="upload-controls">
        <button class="btn btn-primary" id="start-btn">📸 فتح الكاميرا</button>
        <label class="btn btn-outline" for="file-upload" style="display:block; text-align:center;">📁 رفع صورة</label>
        <input type="file" id="file-upload" accept="image/*" style="display:none;">
    </div>

    <div id="crop-controls" style="display:none;">
        <input type="range" id="rotate-slider" min="0" max="23" step="1" value="0" style="width:100%; margin: 10px 0;">
        <button class="btn btn-primary" style="background:#28a745" id="process-btn">🔍 قراءة البيانات</button>
    </div>

    <div id="result-area" class="result-box">
        <div style="font-size:14px;">الاسم: <b id="res-name"></b></div>
        <div class="phone-display" id="res-phone"></div>
        <div style="text-align:center;"><button class="btn btn-edit" id="toggle-edit">✏️ تعديل الرقم</button></div>
        
        <div id="num-pad">
            <div class="key" onclick="k('7')">7</div><div class="key" onclick="k('8')">8</div><div class="key" onclick="k('9')">9</div>
            <div class="key" onclick="k('4')">4</div><div class="key" onclick="k('5')">5</div><div class="key" onclick="k('6')">6</div>
            <div class="key" onclick="k('1')">1</div><div class="key" onclick="k('2')">2</div><div class="key" onclick="k('3')">3</div>
            <div class="key del" onclick="k('X')">X</div><div class="key" onclick="k('0')">0</div><div class="key clear" onclick="k('C')">C</div>
        </div>

        <div class="grid" style="margin-top:10px;">
            <button class="btn btn-primary" style="background:#25D366" id="wa-btn">واتساب</button>
            <button class="btn btn-primary" id="call-btn">اتصال</button>
        </div>
    </div>
</div>

<script>
    let cropper, currentRot = 0, detData = { name: "", phone: "" };
    const img = document.getElementById('image-to-crop'), vid = document.getElementById('video');

    // 1. التقاط
    document.getElementById('start-btn').onclick = async () => {
        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        vid.srcObject = s; vid.style.display = "block";
        document.getElementById('start-btn').innerText = "التقط";
        document.getElementById('start-btn').onclick = () => {
            const c = document.createElement('canvas');
            c.width = vid.videoWidth; c.height = vid.videoHeight;
            c.getContext('2d').drawImage(vid, 0, 0);
            init(c.toDataURL()); s.getTracks().forEach(t => t.stop()); vid.style.display = "none";
        };
    };

    document.getElementById('file-upload').onchange = (e) => {
        const r = new FileReader(); r.onload = (ev) => init(ev.target.result); r.readAsDataURL(e.target.files[0]);
    };

    function init(src) {
        img.src = src; img.style.display = "block";
        document.getElementById('upload-controls').style.display = "none";
        document.getElementById('crop-controls').style.display = "block";
        if (cropper) cropper.destroy();
        cropper = new Cropper(img, { viewMode: 1 });
    }

    document.getElementById('rotate-slider').oninput = function() {
        let a = this.value * 15; cropper.rotate(a - currentRot); currentRot = a;
    };

    // 2. معالجة
    document.getElementById('process-btn').onclick = () => {
        const canvas = cropper.getCroppedCanvas();
        document.getElementById('status').innerText = "جاري القراءة...";
        Tesseract.recognize(canvas.toDataURL(), 'eng+ara').then(({ data: { text } }) => {
            const p = text.replace(/[\s-]/g, '').match(/01[0125][0-9]{8}/);
            const l = text.split('\n').filter(i => i.trim().length > 2);
            detData.name = l[0] ? l[0].replace(/العميل|Name|:/gi, '').trim() : "عميل";
            detData.phone = p ? p[0] : "";
            
            document.getElementById('res-name').innerText = detData.name;
            document.getElementById('res-phone').innerText = detData.phone || "لم يتم العثور";
            document.getElementById('result-area').style.display = "block";
            document.getElementById('crop-controls').style.display = "none";
            document.getElementById('status').innerText = "تم";
            // تثبيت الصورة المقطوعة للمراجعة
            cropper.destroy(); img.src = canvas.toDataURL();
        });
    };

    // 3. تعديل يدوي
    document.getElementById('toggle-edit').onclick = () => {
        const pad = document.getElementById('num-pad');
        pad.style.display = pad.style.display === 'grid' ? 'none' : 'grid';
    };

    window.k = (val) => {
        const disp = document.getElementById('res-phone');
        if (val === 'C') disp.innerText = '';
        else if (val === 'X') disp.innerText = disp.innerText.slice(0, -1);
        else if (disp.innerText.length < 11) disp.innerText += val;
        detData.phone = disp.innerText;
    };

    // 4. تنفيذ
    document.getElementById('wa-btn').onclick = () => window.open(`https://wa.me/2${detData.phone}`);
    document.getElementById('call-btn').onclick = () => window.location.href = `tel:${detData.phone}`;
</script>
</body>
</html>
