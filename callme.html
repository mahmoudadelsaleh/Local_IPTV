<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كاشف الفواتير الاحترافي</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <style>
        :root { --primary: #007bff; --success: #25D366; --bg: #f8f9fa; }
        
        html, body { 
            height: 100%; margin: 0; padding: 0; 
            overflow: hidden; background: var(--bg);
            display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .container { 
            width: 95%; max-width: 450px; background: white; 
            padding: 15px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            box-sizing: border-box; text-align: center; max-height: 98vh; overflow-y: auto;
        }

        .image-wrapper { 
            width: 100%; height: 250px; background: #eee; 
            border-radius: 15px; overflow: hidden; margin-bottom: 10px;
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        img { max-width: 100%; display: none; }
        #video { width: 100%; height: 100%; object-fit: cover; display: none; border-radius: 15px; }

        .btn { 
            width: 100%; padding: 12px; margin: 5px 0; border-radius: 10px; 
            border: none; font-weight: bold; cursor: pointer; font-size: 16px; box-sizing: border-box;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-outline { background: #6c757d; color: white; }

        /* ستايل السلايدر */
        .slider-container { margin: 15px 0; text-align: right; background: #f0f0f0; padding: 10px; border-radius: 10px; }
        input[type=range] { width: 100%; cursor: pointer; }

        .result-box { 
            display: none; border: 2px solid var(--primary); 
            border-radius: 15px; padding: 12px; margin-top: 15px; text-align: right;
        }
        .msg-input { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc; margin: 8px 0; box-sizing: border-box; }
        .msg-list { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
        .chip { background: #e9ecef; padding: 4px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; border: 1px solid #ddd; }
        .chip.active { background: var(--primary); color: white; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        #status { font-size: 12px; color: #777; margin-bottom: 8px; height: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h4 style="margin:0 0 10px 0;">كاشف الفواتير 📄</h4>
    <div id="status">جاهز للاستخدام</div>

    <div class="image-wrapper">
        <video id="video" autoplay playsinline></video>
        <img id="image-to-crop">
    </div>

    <div id="upload-controls">
        <button class="btn btn-primary" id="start-btn">📸 فتح الكاميرا</button>
        <label class="btn btn-outline" for="file-upload">📁 رفع صورة</label>
        <input type="file" id="file-upload" accept="image/*" style="display:none;">
    </div>

    <div id="crop-controls" style="display:none;">
        <div class="slider-container">
            <label>ضبط الزاوية (إزاحة 15°): <span id="angle-val">0</span>°</label>
            <input type="range" id="rotate-slider" min="0" max="23" step="1" value="0">
        </div>
        <div class="grid">
            <button class="btn btn-success" id="process-btn">🔍 تعرف الآن</button>
            <button class="btn btn-outline" style="background:#e74c3c;" onclick="location.reload()">❌ إلغاء</button>
        </div>
    </div>

    <div id="result-area" class="result-box">
        <div style="font-size: 14px;">الاسم: <b id="res-name"></b></div>
        <div style="font-size: 14px;">الرقم: <b id="res-phone"></b></div>
        <hr>
        <div class="msg-list" id="msg-list"></div>
        <textarea id="custom-msg" class="msg-input" placeholder="نص الرسالة..."></textarea>
        <button class="btn btn-outline" style="font-size:11px; padding:4px;" onclick="saveMsg()">💾 حفظ الرسالة</button>
        
        <div class="grid">
            <button class="btn btn-success" id="wa-btn">💬 واتساب</button>
            <button class="btn btn-primary" id="call-btn">📞 اتصال</button>
        </div>
        <button class="btn" style="background:#f1c40f; color:black; margin-top:8px;" id="save-contact">👤 حفظ جهة اتصال</button>
    </div>
</div>

<script>
    let cropper;
    let currentRotation = 0;
    const imgElement = document.getElementById('image-to-crop');
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const resultArea = document.getElementById('result-area');
    const angleVal = document.getElementById('angle-val');
    const rotateSlider = document.getElementById('rotate-slider');
    
    let detectedData = { name: "غير معروف", phone: "" };
    let savedMsgs = JSON.parse(localStorage.getItem('msgs')) || ["أهلاً بك، نؤكد طلبك."];

    // --- 1. الكاميرا والرفع ---
    document.getElementById('start-btn').onclick = async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            video.style.display = "block";
            imgElement.style.display = "none";
            document.getElementById('start-btn').innerText = "📸 التقط الصورة";
            document.getElementById('start-btn').onclick = () => {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                initCropper(canvas.toDataURL('image/png'));
                stream.getTracks().forEach(t => t.stop());
                video.style.display = "none";
            };
        } catch(e) { alert("تعذر فتح الكاميرا"); }
    };

    document.getElementById('file-upload').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => initCropper(ev.target.result);
        reader.readAsDataURL(e.target.files[0]);
    };

    // --- 2. التحكم في القص والدوران ---
    function initCropper(source) {
        imgElement.src = source;
        imgElement.style.display = "block";
        document.getElementById('upload-controls').style.display = "none";
        document.getElementById('crop-controls').style.display = "block";
        resultArea.style.display = "none";
        
        if (cropper) cropper.destroy();
        cropper = new Cropper(imgElement, {
            viewMode: 1,
            checkOrientation: true,
            ready() { status.innerText = "اضبط الزاوية والقص ثم اضغط تعرف"; }
        });
    }

    // منطق السلايدر: 24 خطوة، كل خطوة 15 درجة
    rotateSlider.oninput = function() {
        let step = parseInt(this.value);
        let angle = step * 15;
        angleVal.innerText = angle;
        
        // حساب الفرق للدوران
        let relativeRotation = angle - currentRotation;
        cropper.rotate(relativeRotation);
        currentRotation = angle;
    };

    // --- 3. التحليل OCR ---
    document.getElementById('process-btn').onclick = () => {
        const croppedCanvas = cropper.getCroppedCanvas();
        status.innerText = "جاري القراءة... ⏳";
        Tesseract.recognize(croppedCanvas.toDataURL(), 'eng+ara')
            .then(({ data: { text } }) => analyze(text));
    };

    function analyze(text) {
        const phone = text.replace(/[\s-]/g, '').match(/01[0125][0-9]{8}/);
        const lines = text.split('\n').filter(l => l.trim().length > 3);
        let name = lines.find(l => l.includes("العميل") || l.includes("Name") || l.includes("Mohamed")) || lines[0] || "من الفاتورة";
        name = name.replace(/العميل|Name|:|Customer/gi, '').trim();

        if (phone) {
            detectedData = { name, phone: phone[0] };
            document.getElementById('res-name').innerText = name;
            document.getElementById('res-phone').innerText = phone[0];
            resultArea.style.display = "block";
            status.innerText = "تمت العملية!";
        } else {
            status.innerText = "لم يتم اكتشاف رقم هاتف";
        }
    }

    // --- 4. المهام الإضافية ---
    function renderMsgs() {
        const box = document.getElementById('msg-list');
        box.innerHTML = '';
        savedMsgs.forEach(m => {
            const c = document.createElement('div');
            c.className = 'chip';
            c.innerText = m.substring(0, 12) + '..';
            c.onclick = () => document.getElementById('custom-msg').value = m;
            box.appendChild(c);
        });
    }

    window.saveMsg = () => {
        const m = document.getElementById('custom-msg').value;
        if (m) { savedMsgs.push(m); localStorage.setItem('msgs', JSON.stringify(savedMsgs)); renderMsgs(); }
    };

    document.getElementById('wa-btn').onclick = () => {
        const msg = encodeURIComponent(document.getElementById('custom-msg').value);
        window.open(`https://wa.me/2${detectedData.phone}?text=${msg}`);
    };

    document.getElementById('call-btn').onclick = () => window.location.href = `tel:${detectedData.phone}`;

    document.getElementById('save-contact').onclick = () => {
        const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${detectedData.name}\nTEL;TYPE=CELL:${detectedData.phone}\nEND:VCARD`;
        const a = document.createElement('a');
        a.download = `${detectedData.name}.vcf`;
        a.href = URL.createObjectURL(new Blob([vcard], {type: "text/vcard"}));
        a.click();
    };

    renderMsgs();
</script>
</body>
</html>
