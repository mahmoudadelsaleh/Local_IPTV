<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كاشف أرقام الفواتير</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #video { width: 100%; border-radius: 10px; display: none; }
        #canvas { display: none; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; margin: 10px 5px; font-size: 16px; width: 80%; }
        .result-box { margin-top: 20px; display: none; padding: 15px; border: 2px dashed #007bff; border-radius: 10px; }
        .options-btn { background: #28a745; width: 100%; }
        .wa-btn { background: #25D366; }
        .save-btn { background: #ffc107; color: black; }
        #status { color: #555; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>التقاط رقم الهاتف من الفاتورة</h2>
    
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <button id="start-btn">فتح الكاميرا</button>
    <button id="capture-btn" style="display:none;">التقاط الصورة والتعرف على الرقم</button>
    
    <div id="status"></div>

    <div id="result-area" class="result-box">
        <p>الرقم المكتشف: <strong id="phone-number"></strong></p>
        <hr>
        <button class="options-btn" id="call-btn">📞 اتصال</button>
        <button class="options-btn wa-btn" id="wa-btn">💬 واتساب</button>
        <button class="options-btn save-btn" id="save-btn">👤 حفظ في الهاتف</button>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const startBtn = document.getElementById('start-btn');
    const captureBtn = document.getElementById('capture-btn');
    const status = document.getElementById('status');
    const resultArea = document.getElementById('result-area');
    const phoneDisplay = document.getElementById('phone-number');

    let detectedNumber = "";

    // 1. فتح الكاميرا الخلفية
    startBtn.onclick = async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment" } 
            });
            video.srcObject = stream;
            video.style.display = "block";
            startBtn.style.display = "none";
            captureBtn.style.display = "inline-block";
        } catch (err) {
            alert("خطأ في تشغيل الكاميرا: " + err);
        }
    };

    // 2. التقاط الصورة ومعالجتها
    captureBtn.onclick = () => {
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        status.innerText = "جاري التعرف على الرقم... انتظر لحظة";
        
        // تحويل الصورة لنص باستخدام Tesseract
        Tesseract.recognize(canvas.toDataURL('image/png'), 'eng')
            .then(({ data: { text } }) => {
                extractPhone(text);
            })
            .catch(err => {
                status.innerText = "حدث خطأ أثناء المعالجة";
                console.error(err);
            });
    };

    // 3. استخراج الرقم باستخدام Regex
    function extractPhone(text) {
        // البحث عن أي رقم موبايل يبدأ بـ 01 (تنسيق مصري) ومكون من 11 رقم
        const phoneRegex = /01[0125][0-9]{8}/;
        const match = text.replace(/\s/g, '').match(phoneRegex);

        if (match) {
            detectedNumber = match[0];
            phoneDisplay.innerText = detectedNumber;
            resultArea.style.display = "block";
            status.innerText = "تم العثور على الرقم!";
        } else {
            status.innerText = "لم يتم العثور على رقم واضح، حاول مرة أخرى.";
        }
    }

    // --- الخيارات الثلاثة ---

    // الأول: الاتصال
    document.getElementById('call-btn').onclick = () => {
        window.location.href = `tel:${detectedNumber}`;
    };

    // الثاني: واتساب
    document.getElementById('wa-btn').onclick = () => {
        window.open(`https://wa.me/2${detectedNumber}`, '_blank');
    };

    // الثالث: حفظ الرقم (عبر ملف vCard)
    document.getElementById('save-btn').onclick = () => {
        const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:من الفاتورة\nTEL;TYPE=CELL:${detectedNumber}\nEND:VCARD`;
        const blob = new Blob([vcard], { type: "text/vcard" });
        const url = URL.createObjectURL(blob);
        const newLink = document.createElement('a');
        newLink.download = `${detectedNumber}.vcf`;
        newLink.href = url;
        newLink.click();
    };

</script>
</body>
</html>
