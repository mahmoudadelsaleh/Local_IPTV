<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كاشف ومصحح الفواتير</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <style>
        :root { --primary: #007bff; --success: #25D366; --bg: #f0f2f5; --key-bg: #ffffff; }
        
        html, body { 
            height: 100%; margin: 0; padding: 0; 
            overflow: hidden; background: var(--bg);
            display: flex; align-items: center; justify-content: center;
            font-family: sans-serif;
        }

        .container { 
            width: 100%; max-width: 450px; height: 100vh; background: white; 
            display: flex; flex-direction: column; position: relative;
        }

        /* منطقة العرض العلوية (فيديو أو صورة) */
        .viewer-section {
            flex: 0 0 35%; background: #000; position: relative;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; border-bottom: 3px solid var(--primary);
        }
        #video, #image-to-crop { max-width: 100%; max-height: 100%; }

        /* منطقة التحكم والنتائج */
        .content-section {
            flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column;
        }

        .btn { 
            width: 100%; padding: 12px; margin: 5px 0; border-radius: 10px; 
            border: none; font-weight: bold; cursor: pointer; font-size: 16px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-outline { background: #6c757d; color: white; }

        /* لوحة المفاتيح المدمجة */
        .keyboard {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
            background: #d1d5db; padding: 10px; border-radius: 15px; margin-top: 10px;
        }
        .key {
            background: var(--key-bg); padding: 15px; border-radius: 8px;
            font-size: 20px; font-weight: bold; text-align: center;
            box-shadow: 0 2px 0 #9ca3af; cursor: pointer; user-select: none;
        }
        .key:active { background: #e5e7eb; transform: translateY(2px); box-shadow: none; }
        .key.del { background: #f87171; color: white; }
        .key.clear { background: #9ca3af; color: white; }

        /* حقول الإدخال */
        .edit-input {
            width: 100%; font-size: 22px; text-align: center; padding: 10px;
            border: 2px solid var(--primary); border-radius: 10px; margin: 10px 0;
            background: #fffbe6; font-weight: bold; color: #d32f2f;
        }

        .result-actions { display: none; }
        #status { font-size: 12px; color: #777; text-align: center; margin-bottom: 5px; }
        
        /* شريط الدوران */
        .slider-box { background: #eee; padding: 5px 10px; border-radius: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="viewer-section" id="viewer">
        <video id="video" autoplay playsinline></video>
        <img id="image-to-crop">
    </div>

    <div class="content-section">
        <div id="status">جاهز للمسح الضوئي</div>

        <div id="init-controls">
            <button class="btn btn-primary" id="start-btn">📸 فتح الكاميرا</button>
            <label class="btn btn-outline" for="file-upload" style="display:block; text-align:center;">📁 رفع صورة</label>
            <input type="file" id="file-upload" accept="image/*" style="display:none;">
        </div>

        <div id="crop-controls" style="display:none;">
            <div class="slider-box">
                <label style="font-size: 12px;">الدوران: <span id="angle-val">0</span>°</label>
                <input type="range" id="rotate-slider" min="0" max="23" step="1" value="0" style="width:100%">
            </div>
            <button class="btn btn-success" id="process-btn">🔍 قراءة البيانات</button>
            <button class="btn btn-outline" style="background:#e74c3c" onclick="location.reload()">إلغاء</button>
        </div>

        <div id="edit-section" class="result-actions">
            <div style="text-align:right; font-size:14px;">الاسم: <b id="display-name"></b></div>
            <input type="text" id="phone-input" class="edit-input" readonly>
            
            <div class="keyboard">
                <div class="key" onclick="press('1')">1</div><div class="key" onclick="press('2')">2</div><div class="key" onclick="press('3')">3</div>
                <div class="key" onclick="press('4')">4</div><div class="key" onclick="press('5')">5</div><div class="key" onclick="press('6')">6</div>
                <div class="key" onclick="press('7')">7</div><div class="key" onclick="press('8')">8</div><div class="key" onclick="press('9')">9</div>
                <div class="key clear" onclick="press('C')">C</div><div class="key" onclick="press('0')">0</div><div class="key del" onclick="press('⌫')">⌫</div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;">
                <button class="btn btn-success" id="wa-btn">💬 واتساب</button>
                <button class="btn btn-primary" id="call-btn">📞 اتصال</button>
            </div>
            <button class="btn" style="background:#f1c40f;" id="save-contact">👤 حفظ جهة الاتصال</button>
        </div>
    </div>
</div>

<script>
    let cropper;
    let currentRotation = 0;
    const imgElement = document.getElementById('image-to-crop');
    const video = document.getElementById('video');
    const phoneInput = document.getElementById('phone-input');
    const editSection = document.getElementById('edit-section');
    const status = document.getElementById('status');

    let detectedData = { name: "", phone: "" };

    // --- 1. التقاط/رفع الصورة ---
    document.getElementById('start-btn').onclick = async () => {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        video.style.display = "block";
        document.getElementById('start-btn').innerText = "📸 التقط الآن";
        document.getElementById('start-btn').onclick = () => {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            initCropper(canvas.toDataURL('image/png'));
            stream.getTracks().forEach(t => t.stop());
            video.style.display = "none";
        };
    };

    document.getElementById('file-upload').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => initCropper(ev.target.result);
        reader.readAsDataURL(e.target.files[0]);
    };

    function initCropper(source) {
        imgElement.src = source;
        imgElement.style.display = "block";
        document.getElementById('init-controls').style.display = "none";
        document.getElementById('crop-controls').style.display = "block";
        if (cropper) cropper.destroy();
        cropper = new Cropper(imgElement, { viewMode: 1, checkOrientation: true });
    }

    // دوران بالسلايدر
    document.getElementById('rotate-slider').oninput = function() {
        let angle = this.value * 15;
        document.getElementById('angle-val').innerText = angle;
        cropper.rotate(angle - currentRotation);
        currentRotation = angle;
    };

    // --- 2. التحليل وعرض لوحة المفاتيح ---
    document.getElementById('process-btn').onclick = () => {
        const croppedData = cropper.getCroppedCanvas().toDataURL();
        status.innerText = "جاري القراءة... ⏳";
        
        // استبدال الصورة الأصلية بالصورة المقتصة للمراجعة الدائمة
        cropper.destroy();
        imgElement.src = croppedData;
        document.getElementById('crop-controls').style.display = "none";

        Tesseract.recognize(croppedData, 'eng+ara').then(({ data: { text } }) => {
            const phone = text.replace(/[\s-]/g, '').match(/01[0125][0-9]{8}/);
            const lines = text.split('\n').filter(l => l.trim().length > 2);
            detectedData.name = lines[0] ? lines[0].replace(/العميل|Name|:/gi, '').trim() : "عميل جديد";
            detectedData.phone = phone ? phone[0] : "";
            
            document.getElementById('display-name').innerText = detectedData.name;
            phoneInput.value = detectedData.phone;
            editSection.style.display = "block";
            status.innerText = "راجع الرقم مع الصورة في الأعلى";
        });
    };

    // --- 3. لوحة المفاتيح المدمجة ---
    window.press = (key) => {
        if (key === 'C') phoneInput.value = '';
        else if (key === '⌫') phoneInput.value = phoneInput.value.slice(0, -1);
        else if (phoneInput.value.length < 11) phoneInput.value += key;
        detectedData.phone = phoneInput.value;
    };

    // --- 4. الأكشن النهائي ---
    document.getElementById('wa-btn').onclick = () => window.open(`https://wa.me/2${detectedData.phone}`);
    document.getElementById('call-btn').onclick = () => window.location.href = `tel:${detectedData.phone}`;
    document.getElementById('save-contact').onclick = () => {
        const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${detectedData.name}\nTEL;TYPE=CELL:${detectedData.phone}\nEND:VCARD`;
        const a = document.createElement('a');
        a.download = `${detectedData.name}.vcf`;
        a.href = URL.createObjectURL(new Blob([vcard], {type: "text/vcard"}));
        a.click();
    };
</script>
</body>
</html>
